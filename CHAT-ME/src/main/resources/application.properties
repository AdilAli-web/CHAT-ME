spring.application.name=CHAT-ME

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/chat?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Jackson deserialization
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false

# Session configuration
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Error response security
server.error.include-message=never
server.error.include-stacktrace=never
server.port=8080

app.frontend-origins=http://localhost:5173