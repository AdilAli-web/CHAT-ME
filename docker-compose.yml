
services:
  db:
    image: mysql:8.4
    container_name: chatme-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: chatme
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./CHAT-ME
      dockerfile: Dockerfile
    container_name: chatme-backend
    restart: unless-stopped
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/chatme?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SERVER_PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatme-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
